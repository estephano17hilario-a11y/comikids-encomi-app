name: Sincronización Diaria 23:59 de Agencias Shalom

on:
  # Ejecución automática todas las noches a las 23:59 (Hora Perú UTC-5 = 04:59 UTC)
  schedule:
    - cron: '59 4 * * *'
  # Permite ejecución manual desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  sync-shalom-agencies:
    name: Sincronización Inteligente Shalom (Diff, Nuevas, Modificadas y Bajas)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🚀 Ejecutar Pipeline de Ingesta Inteligente
        env:
          SHALOM_API_KEY: ${{ secrets.SHALOM_API_KEY || 'sk_qm4rm5ivepety4ausqnubkfegp4yr2lnqu3p4q55oc3v4yzw3oma' }}
          SHALOM_API_URL: ${{ secrets.SHALOM_API_URL || 'https://api.shalom-api-peru.com' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://api.89.117.73.97.sslip.io' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc4Nzg0OTc2MCwiZXhwIjo0OTQzNTIzMzYwLCJyb2xlIjoiYW5vbiJ9._DvifLx6sViDd5UePak7xswzmT6dQp9FoQZqPnyxeRU' }}
        run: node scripts/sync-shalom.mjs
