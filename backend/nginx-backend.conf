# ==============================================================================
# Nginx Reverse Proxy Config para Incomi Backend Fastify (Puerto 3000 -> 443 SSL)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name backend.89.117.73.97.sslip.io api-backend.89.117.73.97.sslip.io;

    # Redirección obligatoria a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.89.117.73.97.sslip.io api-backend.89.117.73.97.sslip.io;

    # Certificados SSL (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/backend.89.117.73.97.sslip.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/backend.89.117.73.97.sslip.io/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
