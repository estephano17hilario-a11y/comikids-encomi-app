services:
  # ----------------------------------------------------------------------------
  # REDIS: Broker para BullMQ y Caché de Sesiones
  # ----------------------------------------------------------------------------
  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-password_redis_seguro}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - /opt/redis/data:/data
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password_redis_seguro}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # POSTGRESQL: Persistencia Interna para Evolution API v2
  # ----------------------------------------------------------------------------
  evolution_postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution_db}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution_user}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_secret_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution_user} -d ${EVOLUTION_DB_NAME:-evolution_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # EVOLUTION API v2: Gateway de WhatsApp
  # ----------------------------------------------------------------------------
  evolution_api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: evolution_api
    restart: unless-stopped
    depends_on:
      evolution_redis:
        condition: service_healthy
      evolution_postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080" # Solo expuesto localmente; Nginx actúa como Reverse Proxy
    environment:
      # Servidor
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://89.117.73.97:8080}
      
      # Autenticación Global
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-clave_global_evolution_segura}
      
      # Base de Datos PostgreSQL
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution_user}:${EVOLUTION_DB_PASSWORD:-evolution_secret_password}@evolution_postgres:5432/${EVOLUTION_DB_NAME:-evolution_db}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_v2
      
      # Caché Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-password_redis_seguro}@evolution_redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      
      # Webhooks Globales
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend_api:3000/webhook/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      
      # Configuración de Mensajería
      CONFIG_SESSION_PHONE_CLIENT: "Comikids WhatsApp AI"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      DEL_INSTANCE: "false"
      STORE_MESSAGES: "true"
      STORE_MESSAGE_UP: "true"
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      CLEAN_STORE_CLEANING_INTERVAL: 7200
      CLEAN_STORE_MESSAGES: "true"
      CLEAN_STORE_MESSAGE_UP: "true"
      CLEAN_STORE_CONTACTS: "true"
      CLEAN_STORE_CHATS: "true"
    volumes:
      - /opt/evolution/instances:/evolution/instances
    networks:
      - internal-network

volumes:
  evolution_postgres_data:
    name: evolution_postgres_data

networks:
  internal-network:
    external: true
