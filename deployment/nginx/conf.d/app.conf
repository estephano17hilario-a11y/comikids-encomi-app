# ==============================================================================
# CONFIGURACIÓN VIRTUAL HOST NGINX: REVERSE PROXY FASTIFY & EVOLUTION API
# ==============================================================================

# Upstream definitions
upstream fastify_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream evolution_gateway {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Servidor HTTP: Manejo de Certbot ACME Challenge y Redirección HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Desafío ACME para renovación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /opt/nginx/certbot-challenge;
        try_files $uri =404;
    }

    # Endpoint directo por IP para Backend (en caso de no tener dominio activo)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastify_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook Evolution API
    location /webhook/ {
        limit_req zone=webhook_limit burst=50 nodelay;
        proxy_pass http://fastify_backend/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para Evolution API
    location /evolution/ {
        proxy_pass http://evolution_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ruta por defecto
    location / {
        proxy_pass http://fastify_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
